services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    container_name: rag-jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  backend:
    build: .
    container_name: rag-backend
    ports:
      - "8000:8000"
    environment:
      # Ollama stays native on the host (see README) — reached from the
      # container via host.docker.internal. qdrant/jaeger use their
      # in-compose service names, not localhost.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:7b-instruct
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - QDRANT_URL=http://qdrant:6333
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - ACTIVE_PROMPT_VERSION=v1
    extra_hosts:
      # host.docker.internal resolves natively on Docker Desktop (macOS);
      # this makes the same compose file work on Linux hosts too.
      - "host.docker.internal:host-gateway"
    volumes:
      # Cross-encoder / sparse-encoder models are downloaded from
      # HuggingFace on first use (~9s+, see Sprint 5/8) — cache them so
      # `docker compose down` + `up` doesn't re-download every time.
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  qdrant_storage:
  hf_cache:
